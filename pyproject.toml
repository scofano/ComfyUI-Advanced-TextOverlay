[project]
name = "advanced-textoverlay"
description = "4 nodes: Advanced Text Overlay (image + video) with rich HTML text, animations, and full typography controls; Instagram Question Box (image + video) with two-panel sticker layout, anti-aliased corners, independent header/body heights, and soft drop-shadow."
version = "1.5.0"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "torch",
    "Pillow",
    "imageio",
    "tqdm",
]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/scofano/ComfyUI-Advanced-TextOverlay"
Documentation = "https://github.com/scofano/ComfyUI-Advanced-TextOverlay#readme"
Issues = "https://github.com/scofano/ComfyUI-Advanced-TextOverlay/issues"

[tool.comfy]
PublisherId = "dansco"
DisplayName = "Advanced Text Overlay"
Icon = "https://raw.githubusercontent.com/scofano/ComfyUI-Advanced-TextOverlay/refs/heads/main/ato-icon.jpg"